name: Weekly compatibility
on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[dev]'
      - env:
          SUPERVISOR_TOKEN: ""
          ANTHROPIC_API_KEY: ""
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/empty-claude-config
        run: pytest -q && ffmpeg -version

