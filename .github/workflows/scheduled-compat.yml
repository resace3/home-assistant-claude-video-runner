name: Weekly compatibility
on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e '.[dev]'
      - env:
          SUPERVISOR_TOKEN: ""
          ANTHROPIC_API_KEY: ""
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/empty-claude-config
        run: pytest -q && ffmpeg -version

