name: Multi-platform container
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: frenck/action-addon-linter@f995494fd84fae6310d23617e66d0e37de4f14eb # v2.21.0
        with:
          path: claude_video_runner
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: local/claude-video-runner:test
      - name: Load and smoke-test architecture under QEMU
        run: |
          docker buildx build --platform '${{ matrix.platform }}' --load -t local/claude-video-runner:${{ strategy.job-index }} .
          docker run --rm local/claude-video-runner:${{ strategy.job-index }} --help
          docker run --rm --entrypoint ffmpeg local/claude-video-runner:${{ strategy.job-index }} -version
          docker run --rm --entrypoint node local/claude-video-runner:${{ strategy.job-index }} --version
          docker run --rm --entrypoint claude local/claude-video-runner:${{ strategy.job-index }} --version
